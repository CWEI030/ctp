# Copy this file to accounts.local.ini, replace every <...> placeholder, and
# run: chmod 600 config/accounts.local.ini
#
# Sections may be added or removed. Four examples document the acceptance
# threshold; they are not a fixed account limit.

[account.account1]
enabled=true
broker_id=9999
user_id=<USER_ID_1>
password=<PASSWORD_1>
app_id=<APP_ID_1>
auth_code=<AUTH_CODE_1>
trader_front=tcp://<TRADER_HOST_1>:<PORT_1>

