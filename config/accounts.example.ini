# Copy this file to accounts.local.ini, replace every <...> placeholder, and
# run: chmod 600 config/accounts.local.ini
#
# Sections may be added or removed. Four examples document the acceptance
# threshold; they are not a fixed account limit.

[engine]
profile=simnow-7x24
market_front=tcp://<MARKET_HOST>:<PORT>
exchange_id=CFFEX
instrument=IF2609
minimum_price_increment=0.2

[strategy]
enabled=false
trigger_price_ticks=4000
entry_protection_ticks=2
cancel_after_market_ticks=10
max_signals_per_run=1
close_reprice_after_market_ticks=10
max_close_reprices=3

[risk]
max_order_volume=1
max_net_position=1
max_active_open_orders=1
max_orders_per_day=2
max_cancels_per_day=4
max_order_rate_per_second=1
max_price_deviation_ticks=2
min_available_funds=10000.00
market_stale_after_ms=1000
kill_switch=true

[account.account1]
enabled=true
broker_id=9999
user_id=<USER_ID_1>
password=<PASSWORD_1>
app_id=<APP_ID_1>
auth_code=<AUTH_CODE_1>
trader_front=tcp://<TRADER_HOST_1>:<PORT_1>

[account.account2]
enabled=true
broker_id=9999
user_id=<USER_ID_2>
password=<PASSWORD_2>
app_id=<APP_ID_2>
auth_code=<AUTH_CODE_2>
trader_front=tcp://<TRADER_HOST_2>:<PORT_2>

[account.account3]
enabled=true
broker_id=9999
user_id=<USER_ID_3>
password=<PASSWORD_3>
app_id=<APP_ID_3>
auth_code=<AUTH_CODE_3>
trader_front=tcp://<TRADER_HOST_3>:<PORT_3>

[account.account4]
enabled=true
broker_id=9999
user_id=<USER_ID_4>
password=<PASSWORD_4>
